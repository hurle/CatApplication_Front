<form [formGroup]="searchCatForm" (ngSubmit)="onSearch()" class='cat-search-form'>
    <div class="div-container-form">

        <div class="flex flex-col gap-1.5 w-full md:w-64">
            <label for="breedId" class="form-label-cat">Breed:</label>

            <!-- Select dropdown for cat breeds -->
            <select id="breedId" formControlName="breedId" class="form-input-cat">
                <option value="">Select a breed</option>
                <!-- Options form breeds endpoint -->
                @for (breed of breeds$ | async; track breed.id) {
                    <option [value]="breed.id">
                        {{ breed.name }}
                    </option>
                }
            </select>
        </div>

        <div class="flex flex-col gap-1.5 w-full md:w-64">
            <label for="breedId" class="form-label-cat">Number of Images:</label>
            <!-- Input for number of images to fetch -->
            <input onlyNumbers id="limit" type="number" formControlName="limit" class="form-input-cat" min="1" max="100" />
        </div>

        <div class="flex gap-2 w-full md:w-auto justify-end">
            <button type="submit" class="form-button-common text-gray-700 bg-white border border-gray-300  hover:bg-gray-50 focus:ring-2 focus:ring-gray-200" [disabled]="searchCatForm.invalid">Search</button>
            <button type="button" (click)="CleanSearch()" class="form-button-common text-white bg-blue-600 border border-blue-600  hover:bg-blue-700 focus:ring-blue-300   shadow-sm">Clear</button>
        </div>
    </div>
</form>
<div>
    <app-cat-grid [images]="(catImages$ | async) || []" [isLoading]="isloading"></app-cat-grid>
</div>
